# ============================================================================
# CryptoTrade 学习项目 - 打包与依赖（pyproject.toml）
# ============================================================================
# 说明：
# - 作为“权威依赖入口”，用于声明构建与运行依赖
# - 分类清晰，后续新增按分类追加，便于维护
# - 与主项目依赖隔离，避免冲突
#
# 使用：
#   开发安装（源代码可改动即时生效）：
#     pip install -e cryptotrade
#   运行入口（Console Script）：
#     cryptotrade-run
# ============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptotrade"
version = "0.1.0"
description = "CryptoTrade learning project"
requires-python = ">=3.10"
#
# ────────────────────────────────────────────────────────────────────────────
# 🏛️ 核心与配置 (Core & Configuration)
# ────────────────────────────────────────────────────────────────────────────
# 仅列出当前实际用到的运行依赖；后续按分类追加
dependencies = [
  "pyyaml>=6,<7"   # YAML 配置解析（加载策略/交易所/risk 配置）
]

[project.scripts]
# 这里的 "cryptotrade.run:cli" 指的是包内 run 模块的 cli 函数
cryptotrade-run = "cryptotrade.run:cli"
cryptotrade-rest = "cryptotrade.run_rest:cli"
cryptotrade-monitor = "cryptotrade.run_monitor:cli"
cryptotrade-scanner = "cryptotrade.run_scanner:cli"
#
# ────────────────────────────────────────────────────────────────────────────
# 可选依赖分组（Extras）
# ────────────────────────────────────────────────────────────────────────────
# 使用方法：
#   pip install -e .[async]
#   pip install -e .[cli]
#   pip install -e .[test]
#   如果终端（如 zsh）对方括号敏感，可能需要加引号：
#   例如 pip install -e ".[async]"
# 说明：
# - 当前保持最小依赖，分组先占位；实际用到再逐步追加
# - 建议版本区间遵循“兼容向前、避免漂移”的策略（如 >=X,<Y）
[project.optional-dependencies]
async = [
  # "httpx>=0.27,<0.28"       # 示例：HTTP 客户端（后续需要时再启用）
    "websockets>=12,<13",      # 示例：WebSocket 客户端
    "aiohttp>=3.9,<4.0"        # 异步 HTTP 客户端 (用于 REST API)
]
cli = [
    "rich>=13,<14"            # 示例：更好的 CLI 输出
  # "typer>=0.12,<0.13"       # 示例：增强命令行参数体验
]
test = [
  # "pytest>=8,<9"            # 示例：单元测试
  # "ruff>=0.6,<0.7"          # 示例：代码规范检查
  # "mypy>=1.11,<1.12"        # 示例：类型检查
]

#
# ────────────────────────────────────────────────────────────────────────────
# 包声明设置（显式声明 cryptotrade 为顶层包）
# ────────────────────────────────────────────────────────────────────────────
[tool.setuptools]
packages = ["cryptotrade"]
package-dir = { "cryptotrade" = "." }
