# ============================================================================
# CryptoTrade 学习项目 - 风险控制基础配置
# ----------------------------------------------------------------------------
# 用途：
# - 给所有学习策略提供一个“简单可理解”的风险上限
# - 当前只做两件事：限制总仓位规模、限制单日最大亏损百分比
# - 未来可以逐步扩展为更完整的风控模块（逐策略/逐交易所）
# ============================================================================

# 单策略或全局允许的最大仓位名义价值（单位：USDC）
max_position_value: 5000.0

# 单日最大亏损比例（例如 2.0 表示 2%）
max_loss_percent: 2.0

