# ============================================================================
# CryptoTrade 学习项目 - 交易所配置（DEX 示例：Paradex）
# ----------------------------------------------------------------------------
# 用途：
# - 为学习用 MockExchange 提供“逻辑交易所名称”
# - 指定该 DEX 在本地模拟中参与哪些交易对
# - 仅作为轻量配置，后续可逐步扩展为真实链上/API 配置
# ============================================================================
name: paradex           # 交易所标识（与代码中的 name 对应）
enabled: true           # 是否启用该交易所（false 时会被跳过）
symbols:                # 本交易所参与监控/策略的合约列表
  - BTC-USDC-PERP
  - ETH-USDC-PERP

