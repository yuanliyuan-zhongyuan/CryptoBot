# ==============================================================================
# Binance 全市场雷达扫描配置文件
# ==============================================================================
# 本配置文件用于 CryptoTrade 小项目的 run_scanner.py 脚本。
# 专门针对 Binance 交易所进行全市场扫描，发现高波动机会。
#
# 使用说明：
# 1. 运行脚本：python -m cryptotrade.run_scanner
# 2. 修改配置：直接编辑本文件，保存后重启脚本即可生效
# ==============================================================================

binance_scanner:
  
  # ============================================================================
  # 基础设置
  # ============================================================================
  exchange: "binance"
  
  # ============================================================================
  # 扫描设置 (Scan Settings)
  # ============================================================================
  scan:
    # 扫描间隔 (秒)
    # ⚠️ 为了 IP 安全，建议不要低于 60秒 (1分钟)
    # 如果设置过低 (如 10秒)，可能会触发交易所 API 限流 (HTTP 429)
    interval: 60
    
    # 最小安全间隔 (秒) - 低于此值会在启动时发出警告
    min_safe_interval: 30
    
    # 每次扫描返回的结果数量 (Top N)
    limit: 20

  # ============================================================================
  # 市场设置 (Market Settings)
  # ============================================================================
  markets:
    # 现货市场 (Spot)
    spot:
      enabled: true
      min_volume: 10000000 # 最小 24h 成交额 (USDT) - 1000万
      
    # U本位合约市场 (Futures)
    futures:
      enabled: true
      min_volume: 50000000 # 最小 24h 成交额 (USDT) - 5000万 (合约通常量大)

  # ============================================================================
  # 过滤设置 (Filter Settings)
  # ============================================================================
  filters:
    # 只扫描以此结尾的交易对 (通常是 USDT)
    quote_assets: 
      - "USDT"
    
    # 排除的基础货币 (Base Asset) - 如稳定币、杠杆代币等
    excluded_coins: 
      - "USDC"
      - "USDT"
      - "BUSD"
      - "DAI"
      - "TUSD"
      - "FDUSD"
      - "EURI"
      - "EUR"
