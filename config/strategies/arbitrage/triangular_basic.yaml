# ============================================================================
# CryptoTrade 学习项目 - 三角套利策略基础配置（Triangular Basic）
# ----------------------------------------------------------------------------
# 用途：
# - 定义一个最小可运行的“三角套利监控”策略
# - 通过三条腿（legs）组合来观察价差闭环
# - 当前仅做监控，不下单，用于理解结构和数据流
# ============================================================================
type: triangular_basic

system_mode:
  monitor_only: true        # true=仅监控三角价差，不执行真实交易

# 三角套利组合定义
triangles:
  - name: BTC-ETH-USDC      # 组合名称（方便在日志/输出中识别）
    legs:                   # 三条腿对应的合约列表
      - BTC-USDC-PERP
      - ETH-USDC-PERP
      - BTC-ETH-PERP

